services:
  backend:
    build: ./backend
    container_name: transactional-api

    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: transactional_order_system

    ports:
      - "3000:3000"

    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: transactional-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactional_order_system

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: